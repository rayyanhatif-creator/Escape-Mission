<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproduction of image_0.png Design</title>
    <style>
        /* إعدادات الخلفية السوداء العامة بدقة */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000000; /* خلفية سوداء مطلقة */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif; /* الخط العام لمتصفح الويب */
        }

        /* حاوية واجهة الذكاء الاصطناعي (iFrame Container) */
        /* قمت بضبط الأبعاد والموضع لتطابق الصورة image_0.png */
        .ai-container {
            width: 100%;
            max-width: 90vw; /* عرض مرن يعتمد على عرض الشاشة، محاكي للأصل */
            height: 80vh; /* ارتفاع مرن يعتمد على ارتفاع الشاشة */
            position: relative;
            background-color: #121212; /* لون الخلفية الداخلية المائل للرمادي الداكن */
            
            /* أزياق بسيطة (رماي داكن) */
            border: 1px solid #333333; 
            border-radius: 4px; /* زوايا دائرية خفيفة */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); /* ظل خارجي داكن */
            
            overflow: hidden; /* لضمان عدم خروج الـ iFrame عن الحواف */
        }

        /* تنسيق شريط العنوان (اختياري، يضيف لمسة واقعية للأصل) */
        .window-header {
            height: 30px;
            background-color: #222222;
            border-bottom: 1px solid #333333;
            display: flex;
            align-items: center;
            padding-left: 10px;
            box-sizing: border-box;
        }
        
        .window-header span {
            color: #aaaaaa;
            font-size: 0.8rem;
        }

        /* تنسيق الـ iFrame نفسه */
        /* هو الآن يستدعي الرابط الذي يظهر الخطأ */
        .ai-iframe {
            width: 100%;
            height: calc(100% - 30px); /* يطرح ارتفاع شريط العنوان */
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="ai-container">
        <div class="window-header">
            <span>AI Interface (Reproduction)</span>
        </div>
        
        <iframe 
            src="https://voxa-3a7ac828dfb6.herokuapp.com/webhook/9e69bf82-0dfa-4a70-aab9-fb169d28e3e5" 
            class="ai-iframe"
            title="AI Chat Interface">
        </iframe>
    </div>

</body>
</html>
